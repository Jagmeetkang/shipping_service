spring:
  application:
    name: shipping_service
  datasource:
    url: jdbc:postgresql://localhost:5432/shipping_service_db
    username: shipping_user
    password: pass
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update  # or 'create' if you want to recreate tables
    show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
  port: 9095